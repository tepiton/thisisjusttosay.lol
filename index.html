<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>laptopistan.com</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #eee;
      --fg: #111;
      --dim: #6b6b6b;
      --line: #111;
      --sel-bg: #ec3013;
      --sel-fg: #fff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #333;
        --fg: #eee;
        --dim: #9a9a9a;
        --line: #eee;
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-weight: 300;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 28px;
    }

    header, footer {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 24px;
    }

    header {
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
    }

    footer {
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }

    .lbl {
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .dim {
      color: var(--dim);
    }

    main {
      display: grid;
      justify-items: center;
      padding: 40px 0;
      min-height: 0;
      overflow: hidden;
    }

    figure {
      margin: 0;
      width: auto;
      height: 100%;
      min-height: 0;
      max-width: 100%;
      aspect-ratio: 3/2;
    }

    .frame {
      height: 100%;
      border: 1px solid var(--line);
      padding: 14px;
      box-sizing: border-box;
    }

    .frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(1);
    }

    ::selection {
      background: var(--sel-bg);
      color: var(--sel-fg);
    }
  </style>
</head>
<body>
  <header>
    <div class="lbl">laptopistan.com</div>
    <div class="lbl dim">08 / 25</div>
  </header>
  <main>
    <figure>
      <div class="frame">
        <img src="https://picsum.photos/800/" alt="">
      </div>
    </figure>
  </main>
  <footer>
    <div class="lbl dim"><a href="https://pborenstein.com">pborenstein</a> 2026 <a href="https://picsum.photos/">picsum.photos></a></div>
  </footer>
</body>
</html>
